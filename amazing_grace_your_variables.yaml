# [OPTION] Email used in Git commits.
#
# [GIT][NOTE] If you begin to use Amazing Grace, you can use email which you specified when you registered
# on a hosting service (GitLab, GitHub or its alternatives) for your site.
# But Git can publicly print user’s emails, therefore, it’s better to create “commit email”.
# “Commit e-mails” looks like “806166-Kristinita@users.noreply.gitlab.com” on GitLab and
# “Kristinita@users.noreply.github.com” on GitHub.
#
# [GIT][GITLAB][GITHUB] Instructions to creating commit emails on GitLab and GitHub:
# https://docs.gitlab.com/user/profile/#use-an-automatically-generated-private-commit-email
# https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-personal-account-on-github/managing-email-preferences/setting-your-commit-email-address
#
# ---
#
# [MANUAL][GIT][GITHUB] Manual how to set the commit email on GitHub.
# Use the similar steps for setting the commit email on GitLab.
#
# 1. https://github.com/settings/emails → “Keep my email addresses private”:
# https://stackoverflow.com/a/71542189/5951529
#
# 2. https://github.com/settings/emails → “Primary email address” → get your commit email:
# https://stackoverflow.com/posts/comments/121169456
#
# 3. Set your GitHub commit e-mail for both, global and local settings:
# https://stackoverflow.com/a/51097104/5951529
#
# git config --global user.email "{username}@users.noreply.github.com"
# git config user.email "{username}@users.noreply.github.com"
#
# [NOTE] Don’t use the syntax "{ID}+{username}@users.noreply.github.com" for GitHub commit emails
# (and use the syntax "{ID}+{username}@users.noreply.gitlab.com" for GitLab commit emails).
# Commits in this case are displayed as “Unverified”.
# GitHub marks GPG-signed commits using e-mails with {ID} as “Unverified”:
# https://github.com/orgs/community/discussions/41199
# https://i.imgur.com/6svALVn.png
#
# 4. Check your Git configuration — run the command “git config --list --show-origin --show-scope”:
# https://stackoverflow.com/a/2115116/5951529
#
# 5. Create the new GPG key for your GitHub commit e-mail without the number ID:
# https://docs.github.com/en/authentication/managing-commit-signature-verification/generating-a-new-gpg-key
# https://github.com/orgs/community/discussions/41199#discussioncomment-8133113
#
# 6. Add this new GPG key to your GitHub account:
# https://docs.github.com/en/authentication/managing-commit-signature-verification/adding-a-gpg-key-to-your-github-account
#
# After all these steps GitHub should mark as “Verified” all your commits pushed to GitHub
COMMIT_EMAIL: Kristinita@users.noreply.github.com

