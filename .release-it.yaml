$schema: https://cdn.jsdelivr.net/gh/release-it/release-it/schema/release-it.json

git:
  addUntrackedFiles: true
  # commit: false
  commitArgs: --signoff
  commitMessage: "deploy(release-it): release v${version}"
  # requireBranch: main
  requireUpstream: true
  tagName: v${version}

hooks:
  after:bump: |
    echo "${changelog}" | python -c "import sys, base64; open('messages/${version}.txt', 'w', encoding='utf-8').write(base64.b64decode(sys.stdin.read()).decode('utf-8'))"

# npx changelogen |
# tee messages/${version}.txt &&
# json -e "this['${version}']='messages/${version}.txt'" -f messages.json --in-place --output json-tab

# git add --all &&
# git commit --message="deploy(release-it): release ${version}" --signoff &&
# git push

kira: goddess

npm:
  publish: false

plugins:
  release-it-changelogen:
    disableVersion: true
    # output: messages/{{newVersion}}.txt
    # templates:
    #   commitMessage: "deploy(release-it): release {{newVersion}}"
    #   tagMessage: v{{newVersion}}

verbose: 2
