git:
  changelog: npx changelogen
  commitArgs: --signoff
  commitMessage: "deploy(release-it): release v${version}"
  pushArgs: --tags
  requireUpstream: false

# github:
#   release: true

hooks:
  before:git:bump: >
    changelog --file - --repo-url https://${repo.host}/${repo.repository} |
    tee messages/${version}.txt
    && sed --in-place '0r messages/${version}.txt' CHANGELOG.md
    && sed --in-place '/"install": "messages\/install.txt"/i
    \\\t"${version}": "messages\/${version}.txt",' messages.json

npm:
  publish: false

plugins:

  release-it-changelogen:
    templates:
      commitMessage: "deploy(release-it): release v{{newVersion}}"
    types:
      deploy:
        title: 🤖 Deployment

