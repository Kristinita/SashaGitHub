git:
  commitArgs: --signoff
  commitMessage: "deploy(release-it): release v${version}"
  pushArgs: --tags
  requireUpstream: false

# github:
#   release: true

npm:
  publish: false

plugins:
  "@release-it/conventional-changelog":
    infile: CHANGELOG.md
    preset:
      name: angular
      types:
      - section: Deployments
        type: deploy

