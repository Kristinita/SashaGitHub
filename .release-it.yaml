git:
  commitArgs: --signoff
  commitMessage: "deploy(release-it): release v${version}"
  pushArgs: --tags
  requireUpstream: false

# github:
#   release: true

hooks:
  after:git:bump: >
    changelog - --repo-url https://${repo.host}/${repo.repository} |
    tee messages/${version}.txt | cat - CHANGELOG.md > temp
    && mv temp CHANGELOG.md && sed --in-place '/"install": "messages\/install.txt"/i
    \t"${version}": "messages\/${version}.txt",' messages.json

npm:
  publish: false

plugins:
  "@release-it/conventional-changelog":
    infile: CHANGELOG.md
    preset:
      name: angular
      types:
      - section: Deployments
        type: deploy
    writerOpts:
      groupBy: scope

